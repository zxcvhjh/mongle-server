<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경북대 컴퓨터학부 챗봇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            display: flex;
            justify-content: flex-end;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .ai-message {
            display: flex;
            justify-content: flex-start;
        }

        .ai-message .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .images {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .images img {
            max-width: 250px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .images img:hover {
            transform: scale(1.05);
        }

        .reference-link {
            display: inline-block;
            margin-top: 8px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .reference-link:hover {
            text-decoration: underline;
        }

        .disclaimer {
            font-size: 0.8rem;
            color: #888;
            margin-top: 8px;
            font-style: italic;
        }

        .chat-input-container {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        #question-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        #question-input:focus {
            border-color: #667eea;
        }

        #send-button {
            margin-left: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #send-button:hover:not(:disabled) {
            transform: scale(1.05);
        }

        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .error-message {
            background: #ffebee !important;
            color: #c62828 !important;
            border-color: #ef5350 !important;
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>경북대 컴퓨터학부 챗봇</h1>
            <p>학사 정보를 물어보세요</p>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message ai-message">
                <div class="message-content">
                    안녕하세요! 경북대학교 컴퓨터학부 챗봇입니다.<br>
                    학사 일정, 공지사항, 교수님 정보 등을 물어보세요.
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" id="question-input" placeholder="질문을 입력하세요..." autocomplete="off">
            <button id="send-button">전송</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const questionInput = document.getElementById('question-input');
        const sendButton = document.getElementById('send-button');

        // 엔터키로 전송
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled) {
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        async function sendMessage() {
            const question = questionInput.value.trim();

            if (!question) {
                return;
            }

            // 사용자 메시지 추가
            addUserMessage(question);

            // 입력창 초기화
            questionInput.value = '';

            // 버튼 비활성화
            sendButton.disabled = true;
            sendButton.textContent = '전송 중...';

            // 로딩 메시지 추가
            const loadingMessage = addLoadingMessage();

            try {
                const response = await fetch('/chatbot/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question })
                });

                // 로딩 메시지 제거
                loadingMessage.remove();

                if (!response.ok) {
                    throw new Error('서버 응답 오류');
                }

                const data = await response.json();

                // AI 응답 추가
                addAiMessage(data);

            } catch (error) {
                console.error('Error:', error);
                loadingMessage.remove();
                addErrorMessage('죄송합니다. 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
            } finally {
                // 버튼 다시 활성화
                sendButton.disabled = false;
                sendButton.textContent = '전송';
                questionInput.focus();
            }
        }

        function addUserMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${escapeHtml(text)}
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function addAiMessage(data) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai-message';

            let content = '<div class="message-content">';

            // 답변 텍스트
            if (data.hasAnswer && data.answer) {
                content += `<div>${escapeHtml(data.answer).replace(/\n/g, '<br>')}</div>`;
            } else if (!data.hasImages) {
                content += '<div>답변을 생성하지 못했습니다.</div>';
            }

            // 이미지
            if (data.hasImages) {
                content += '<div class="images">';
                data.images.forEach(img => {
                    content += `<img src="${escapeHtml(img)}" alt="참고 이미지" onclick="window.open('${escapeHtml(img)}', '_blank')">`;
                });
                content += '</div>';
            }

            // 참고 링크
            if (data.references) {
                content += `<a href="${escapeHtml(data.references)}" target="_blank" class="reference-link">📎 원문 보기</a>`;
            }

            // 면책 조항
            if (data.disclaimer) {
                content += `<div class="disclaimer">${escapeHtml(data.disclaimer)}</div>`;
            }

            content += '</div>';
            messageDiv.innerHTML = content;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai-message';
            messageDiv.innerHTML = `
                <div class="message-content">
                    <div class="loading">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        function addErrorMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai-message';
            messageDiv.innerHTML = `
                <div class="message-content error-message">
                    ${escapeHtml(text)}
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 페이지 로드 시 입력창에 포커스
        window.addEventListener('load', () => {
            questionInput.focus();
        });
    </script>
</body>
</html>
