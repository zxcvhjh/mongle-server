<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이메일 인증</title>
  <style>
    /* Google Fonts Import */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

    /* Basic Styles */
    body {
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .email-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e0e0;
    }

    .email-header {
      background-color: #6CC1F3;
      color: #ffffff;
      padding: 35px 30px;
      text-align: center;
    }

    .email-header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }

    .email-content {
      padding: 40px 30px;
      line-height: 1.7;
      color: #333333;
      font-size: 16px;
    }

    .email-content p {
      margin: 0 0 20px;
    }

    .verification-code-box {
      background-color: #f2f8fc;
      border: 2px dashed #6CC1F3;
      color: #2c3e50;
      font-size: 32px;
      font-weight: 700;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      letter-spacing: 6px;
      margin: 30px 0;
    }

    .email-footer {
      background-color: #f8f9fa;
      color: #888888;
      padding: 25px;
      text-align: center;
      font-size: 12px;
      border-top: 1px solid #e0e0e0;
    }

    .button {
      display: inline-block;
      background-color: #6CC1F3;
      color: #ffffff;
      padding: 12px 25px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 500;
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
<div class="email-container">
  <div class="email-header">
    <h1>Mongle 회원가입 인증</h1>
  </div>
  <div class="email-content">
    <p>안녕하세요!</p>
    <p>Mongle 서비스에 가입해 주셔서 감사합니다. 회원가입을 완료하려면 아래 인증 코드를 입력해주세요.</p>

    <div class="verification-code-box">
      <!-- Thymeleaf 문법을 사용하여 서버로부터 전달받은 인증 코드를 표시합니다. -->
      <span th:text="${verificationCode}">123456</span>
    </div>

    <p>이 인증 코드는 <strong>10분간</strong> 유효합니다.<br>만약 본인이 요청하지 않으셨다면 이 이메일을 무시하셔도 안전합니다.</p>

    <p style="text-align:center;">
      <a href="https://mongle.site" target="_blank" class="button">Mongle 바로가기</a>
    </p>
  </div>
  <div class="email-footer">
    <p>&copy; 2025 Mongle Inc. All Rights Reserved.</p>
    <p>본 메일은 발신 전용으로, 회신되지 않습니다.</p>
  </div>
</div>
</body>
</html>
