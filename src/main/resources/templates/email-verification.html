<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이메일 인증</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
    }
  </style>
</head>
<body
    style="margin: 0; padding: 0; background-color: #f4f7f6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple Gothic', sans-serif;">
<div class="email-container"
     style="max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e0e0;">

  <div class="email-header"
       style="background-color: #6CC1F3;
              color: #ffffff;
              padding: 35px 30px;
              text-align: center;">
    <h1 style="margin: 0;
               font-size: 26px;
               font-weight: 700;
               font-family: 'Noto Sans KR', sans-serif;">Mongle 회원가입 인증</h1>
  </div>

  <div class="email-content"
       style="padding: 40px 30px;
              line-height: 1.7;
              color: #333333;
              font-size: 16px;
              font-family: 'Noto Sans KR', sans-serif;">
    <p style="margin: 0 0 20px;">안녕하세요!</p>
    <p style="margin: 0 0 20px;">Mongle 서비스에 가입해 주셔서 감사합니다. 회원가입을 완료하려면 아래 인증 코드를 입력해주세요.</p>

    <div class="verification-code-box"
         style="background-color: #f2f8fc;
                border: 2px dashed #6CC1F3;
                color: #2c3e50;
                font-size: 32px;
                font-weight: 700;
                padding: 20px;
                text-align: center;
                border-radius: 8px;
                letter-spacing: 6px;
                margin: 30px 0;
                font-family: 'Noto Sans KR', monospace;">
      <span th:text="${verificationCode}">123456</span>
    </div>

    <p style="margin: 0 0 20px;">이 인증 코드는 <strong style="font-weight: 700;">10분간</strong> 유효합니다.<br>만약
      본인이 요청하지 않으셨다면 이 이메일을 무시하셔도 안전합니다.</p>

    <p style="text-align:center; margin: 0 0 20px;">
      <a href="https://sites.google.com/view/mongle-service-introduce" target="_blank"
         class="button"
         style="display: inline-block;
                background-color: #6CC1F3;
                color: #ffffff;
                padding: 12px 25px;
                border-radius: 5px;
                text-decoration: none;
                font-weight: 500;
                margin-top: 10px;
                font-size: 16px;
                font-family: 'Noto Sans KR', sans-serif;">Mongle 소개</a>
    </p>
  </div>

  <div class="email-footer"
       style="background-color: #f8f9fa;
              color: #888888;
              padding: 25px;
              text-align: center;
              font-size: 12px;
              border-top: 1px solid #e0e0e0;
              font-family: 'Noto Sans KR', sans-serif;">
    <p style="margin: 0;">&copy; 2025 Mongle Inc. All Rights Reserved.</p>
    <p style="margin: 5px 0 0;">본 메일은 발신 전용으로, 회신되지 않습니다.</p>
  </div>
</div>
</body>
</html>
